name: Build check
on:
  workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify rendered pages
        run: |
          echo "Generated pages:"
          find _site -maxdepth 2 -name '*.html' | sort
          echo "About page publications:"
          grep -o 'SynLogic[^<]*' _site/index.html
          echo "Publications page entries:"
          grep -c 'listitem\|<li>' _site/publications/index.html
          echo "Contact details:"
          grep -o 'jliugi@connect.ust.hk' _site/index.html | head -n 3
          echo "Sidebar profile:"
          grep -o 'Junteng Liu' _site/index.html | head -n 3